document.getElementById("updated").textContent = DATA.updated;
const menu = document.getElementById("menu");
const grid = document.getElementById("grid");

function showBox(boxId) {
  // highlight the active button
  for (const b of menu.children) b.classList.toggle("active", b.dataset.box === boxId);
  const n = DATA.boxes[boxId].length, total = DATA.rows * DATA.cols;
  document.getElementById("boxTitle").textContent =
    DATA.labels[boxId] + "  (" + n + " samples, " + (total - n) + " empty of " + total + " cells)";

  // quick lookup: "row-col" -> sample
  const lookup = {};
  for (const s of DATA.boxes[boxId]) lookup[s.row + "-" + s.col] = s;

  grid.innerHTML = "";
  // header row with column numbers
  const head = grid.insertRow();
  head.insertCell().outerHTML = "<th></th>";
  for (let c = 1; c <= DATA.cols; c++) head.insertCell().outerHTML = "<th>" + c + "</th>";

  // one table row per letter
  for (let r = 1; r <= DATA.rows; r++) {
    const tr = grid.insertRow();
    tr.insertCell().outerHTML = "<th>" + String.fromCharCode(64 + r) + "</th>";
    for (let c = 1; c <= DATA.cols; c++) {
      const td = tr.insertCell();
      const s = lookup[r + "-" + c];
      const pos = document.createElement("span");
      pos.className = "pos";
      pos.textContent = String.fromCharCode(64 + r) + c;
      if (s) {
        td.append(pos, s.name);
        td.className = "full";
        td.title = s.name + "\nConc: " + s.conc + " µg/µL" + (s.notes ? "\nNote: " + s.notes : "");
      } else {
        td.append(pos, "empty");
        td.className = "empty";
      }
    }
  }
}

for (const boxId of Object.keys(DATA.boxes).sort()) {
  const btn = document.createElement("button");
  btn.textContent = DATA.labels[boxId];
  btn.dataset.box = boxId;
  btn.onclick = () => showBox(boxId);
  menu.appendChild(btn);
}
showBox(Object.keys(DATA.boxes).sort()[0]);
